[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "address_intelligence"
version = "0.1.0"
description = "Reusable address intelligence prototype foundation"
requires-python = ">=3.11"
dependencies = ["python-dotenv", "requests", "faker", "openpyxl", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit", "mcp>=2.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
